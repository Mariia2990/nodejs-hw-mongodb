{
  "openapi": "3.1.0",
  "info": {
    "version": "1.0.0",
    "title": "Contacts Application",
    "license": {
      "name": "Apache 2.0",
      "url": "http://www.apache.org/licenses/LICENSE-2.0.html"
    },
    "description": "This app is created for managing contacts!"
  },
  "servers": [
    {
      "url": "http://localhost:3000"
    },
    {
      "url": "https://nodejs-hw-mongodb.onrender.com"
    }
  ],
  "tags": [
    {
      "name": "Contacts",
      "description": "Operations about contacts"
    },
    {
      "name": "Auth",
      "description": "Auth operations"
    }
  ],
  "paths": {
    "/contacts": {
      "get": {
        "tags": ["Contacts"],
        "summary": "Get all contacts",
        "operationId": "getAllContacts",
        "description": "Get list of contacts",
        "security": [{"bearerAuth": []}],
        "parameters": [
          {"in": "query", "name": "page", "schema": {"type": "integer", "example": 1}},
          {"in": "query", "name": "perPage", "schema": {"type": "integer", "example": 10}},
          {"in": "query", "name": "sortBy", "schema": {"type": "string", "example": "name"}},
          {"in": "query", "name": "sortOrder", "schema": {"type": "string", "enum": ["asc", "desc"], "example": "asc"}},
          {"in": "query", "name": "type", "schema": {"type": "string", "enum": ["work", "home", "personal"], "example": "personal"}},
          {"in": "query", "name": "isFavourite", "schema": {"type": "boolean", "example": true}}
        ],
        "responses": {
          "200": {
            "description": "Get all contacts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/contactsResponse"
                }
              }
            }
          },
          "401": {"$ref": "#/components/responses/401"}
        }
      }
    }
  },
  "components": {
    "schemas": {
      "contact": {
        "type": "object",
        "required": ["_id", "name", "phoneNumber", "contactType", "userId"],
        "properties": {
          "_id": {"type": "string", "example": "6784d7f04c222b0c025c9c80"},
          "name": {"type": "string", "example": "Joi"},
          "phoneNumber": {"type": "string", "example": "380000000025"},
          "email": {"type": "string", "example": "masyakuk@gmail.com"},
          "isFavourite": {"type": "boolean", "example": true},
          "contactType": {"type": "string", "enum": ["work", "home", "personal"], "example": "personal"},
          "userId": {"type": "string", "example": "6784d7f04c222b0c025c9c80"},
          "photo": {"type": "string", "example": "https://res.cloudinary.com/davkgp4m7/image/upload/image.jpg"}
        }
      },
      "contactsResponse": {
        "type": "object",
        "required": ["status", "message", "data"],
        "properties": {
          "status": {"type": "integer", "example": 200},
          "message": {"type": "string", "example": "Successfully found contacts!"},
          "data": {
            "type": "array",
            "items": {"$ref": "#/components/schemas/contact"}
          }
        }
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "responses": {
      "401": {
        "description": "Unauthorized error",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "status": {"type": "integer", "example": 401},
                "message": {"type": "string", "example": "UnauthorizedError"}
              }
            }
          }
        }
      }
    }
  }
}
