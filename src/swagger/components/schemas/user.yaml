type: object
required:
  - _id
  - name
  - email
  - password

properties:
  _id:
    description: "User's id"
    type: string
    example: 67989e992207a0f0bfe149a5
  name:
    description: "User's name"
    type: string
    example: 'Mariia'
  email:
    description: "User's email"
    type: string
    example: 'mariialoz@gmail.com'
  password:
    description: "User's password"
    type: string
    example: 1234
